    <style>/* SAGE E-Card — shared styles (card page + staff index) */
:root {
  --primary: #00834d;
  --primary-dark: #006b3f;
  --bg: #f1f4f9;
  --card: #ffffff;
  --ink: #1f2937;
  --ink-soft: #4b5563;
  --ink-faint: #6b7280;
  --line: #e5e7eb;
  --line-soft: #f3f4f6;
  --radius: 0.75rem;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  background-color: var(--bg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang HK",
    "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

a { color: inherit; }

.card-container {
  max-width: 28rem;
  margin: 0 auto;
  background-color: var(--card);
  min-height: 100vh;
  box-shadow: 0 4px 24px rgba(21, 101, 192, 0.08);
  position: relative;
  padding-bottom: 6.5rem;
}

/* ---- Language switcher ---- */
.lang-switcher {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  z-index: 20;
  display: flex;
  gap: 0.25rem;
  font-size: 0.75rem;
  background-color: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 9999px;
  padding: 0.25rem;
  border: 1px solid rgba(255, 255, 255, 0.25);
}
.lang-btn {
  padding: 0.125rem 0.55rem;
  border-radius: 9999px;
  transition: all 0.2s;
  text-decoration: none;
  color: #fff;
}
.lang-btn.active { background-color: #fff; color: #111827; font-weight: 700; }
.lang-btn.inactive:hover { background-color: rgba(255, 255, 255, 0.15); }

/* ---- Banner ---- */
.banner-bg {
  height: 10rem;
  position: relative;
  overflow: hidden;
  background-color: #e8edf5;
}
.banner-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.banner-fallback {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #00834d 0%, #0e9d5f 55%, #57bb8a 100%);
  color: rgba(255, 255, 255, 0.95);
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.08em;
}

/* ---- Profile ---- */
.profile-sec { padding: 1rem 1.25rem 0; position: relative; }
.avatar-box {
  position: absolute;
  top: -3rem;
  right: 1.25rem;
  width: 6rem;
  height: 6rem;
  border-radius: 9999px;
  border: 4px solid #fff;
  box-shadow: 0 4px 10px rgba(15, 23, 42, 0.12);
  overflow: hidden;
  background-color: #fff;
}
.avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.profile-info { padding-right: 6rem; }
.name { font-size: 1.5rem; font-weight: 700; color: #111827; line-height: 1.25; }
.title { font-size: 0.875rem; font-weight: 600; color: var(--ink-soft); margin-top: 0.375rem; line-height: 1.25; }

/* ---- Contact list ---- */
.contact-list {
  margin-top: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  font-size: 0.875rem;
  color: var(--ink-faint);
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 1rem;
  list-style: none;
}
.contact-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  text-decoration: none;
  color: inherit;
  min-width: 0;
}
.contact-icon { color: #9ca3af; width: 1.1rem; flex-shrink: 0; display: flex; }
.contact-icon svg { width: 1.1rem; height: 1.1rem; }
.contact-label { overflow-wrap: anywhere; }
.link-email { color: var(--primary); text-decoration: none; }
.link-email:hover { text-decoration: underline; }

/* ---- Chat buttons ---- */
.chat-buttons {
  margin-top: 1rem;
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.icon-btn {
  width: 4.5rem;
  height: 2.4rem;
  border-radius: 9999px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.2s;
  background: #fff;
  cursor: pointer;
  text-decoration: none;
}
.icon-btn svg { width: 1.6rem; height: 1.6rem; }
.icon-btn:hover { background-color: #f9fafb; }
.wechat-btn svg { color: #22c55e; }
.whatsapp-btn svg { color: #16a34a; }
.chat-label {
  font-size: 0.875rem;
  color: var(--ink-soft);
  font-weight: 500;
}

/* ---- Modal ---- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background-color: rgba(15, 23, 42, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 1rem;
}
.modal-card {
  background-color: #fff;
  padding: 1.5rem;
  border-radius: 1rem;
  max-width: 20rem;
  width: 100%;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
}
.modal-close {
  position: absolute;
  top: 0.6rem;
  right: 0.9rem;
  color: #9ca3af;
  font-size: 1.4rem;
  background: none;
  border: none;
  cursor: pointer;
  line-height: 1;
}
.modal-close:hover { color: #4b5563; }
.modal-title { font-size: 0.875rem; font-weight: 600; color: var(--ink); margin-bottom: 1rem; }
.modal-img-box { background-color: #f9fafb; padding: 0.5rem; border-radius: 0.5rem; border: 1px solid var(--line-soft); }
.modal-img { width: 12rem; height: 12rem; object-fit: contain; display: block; }
.modal-hint { font-size: 0.6875rem; color: #9ca3af; margin-top: 0.75rem; text-align: center; }
.hidden { display: none !important; }

/* ---- Tabs ---- */
.nav-tabs { margin-top: 1.5rem; border-bottom: 1px solid var(--line); }
.nav-container {
  display: flex;
  justify-content: space-between;
  padding: 0 1.5rem;
  font-size: 0.875rem;
  font-weight: 500;
}
.nav-item {
  padding: 0 0.25rem 0.75rem;
  text-decoration: none;
  color: var(--ink-faint);
  border-bottom: 2px solid transparent;
}
.nav-item.active { border-bottom-color: var(--primary); color: var(--primary); }
.nav-item:hover { color: var(--ink-soft); }

/* ---- Sections ---- */
.content-sec { padding: 0 1.25rem; margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
.section-title { font-size: 1rem; font-weight: 700; color: #111827; margin-bottom: 0.5rem; }
.about-text { font-size: 0.875rem; color: var(--ink-soft); line-height: 1.625; text-align: justify; white-space: pre-line; }
.hr-line { border: 0; border-top: 1px solid var(--line-soft); }

.social-list { display: flex; flex-wrap: wrap; gap: 0.875rem; align-items: center; }
.social-item {
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 9999px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: background-color 0.2s;
  background: #fff;
}
.social-item svg { width: 1.3rem; height: 1.3rem; }
.social-item:hover { background-color: #f9fafb; }

.links-list { display: flex; flex-direction: column; gap: 0.625rem; }
.link-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.625rem;
  background-color: rgba(239, 246, 255, 0.4);
  border: 1px solid #dbeafe;
  border-radius: 0.5rem;
  text-decoration: none;
  transition: background-color 0.2s;
}
.link-item:hover { background-color: #eff6ff; }
.link-icon-box {
  width: 2.25rem;
  height: 2.25rem;
  background-color: #fff;
  border-radius: 0.25rem;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line-soft);
  flex-shrink: 0;
}
.link-icon-box svg { width: 1rem; height: 1rem; }
.link-text { font-size: 0.875rem; font-weight: 500; flex: 1; transition: color 0.2s; }
.link-chevron { color: #d1d5db; flex-shrink: 0; }
.link-chevron svg { width: 0.8rem; height: 0.8rem; }

/* ---- Footer ---- */
.footer-sec {
  text-align: center;
  font-size: 0.6875rem;
  color: #9ca3af;
  padding-top: 2rem;
  padding-bottom: 1rem;
  user-select: none;
}
.footer-sec .ver { opacity: 0.8; margin-bottom: 0.25rem; }

/* ---- Fixed save bar ---- */
.fixed-btn-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 28rem;
  background-color: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 1rem;
  border-top: 1px solid var(--line-soft);
  z-index: 40;
  box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.06);
}
.save-btn {
  width: 80%;
  margin: 0 auto;
  background-color: var(--primary);
  color: #fff;
  text-align: center;
  padding: 0.625rem 0;
  border-radius: 0.75rem;
  font-weight: 700;
  transition: background-color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  text-decoration: none;
}
.save-btn svg { width: 1.1rem; height: 1.1rem; }
.save-btn:hover { background-color: var(--primary-dark); }

@media print {
  .fixed-btn-bar, .lang-switcher { display: none !important; }
  .card-container { box-shadow: none; }
}

/* ---- Staff index page ---- */
.index-page .site-head {
  background: linear-gradient(135deg, #00834d 0%, #0e9d5f 60%, #57bb8a 100%);
  color: #fff;
  padding: 3rem 1.25rem 3.5rem;
  text-align: center;
}
.index-page .site-head img { width: 9rem; height: auto; margin-bottom: 0.75rem; }
.index-page .site-head h1 { font-size: 1.4rem; font-weight: 700; }
.index-page .site-head p { font-size: 0.875rem; opacity: 0.9; margin-top: 0.25rem; }
.staff-grid {
  max-width: 28rem;
  margin: -1.75rem auto 0;
  padding: 0 1.25rem 4rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr));
  gap: 0.875rem;
}
.staff-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1rem;
  text-align: center;
  text-decoration: none;
  color: var(--ink);
  transition: transform 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
}
.staff-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(21, 101, 192, 0.12); }
.staff-card .avatar {
  width: 4.5rem;
  height: 4.5rem;
  border-radius: 9999px;
  overflow: hidden;
  background: #e8edf5;
  display: flex;
  align-items: center;
  justify-content: center;
}
.staff-card .avatar img { width: 100%; height: 100%; object-fit: cover; }
.staff-card .avatar svg { width: 2rem; height: 2rem; color: #9ca3af; }
.staff-card .n { font-size: 0.9375rem; font-weight: 700; }
.staff-card .t { font-size: 0.75rem; color: var(--ink-faint); }
.index-page .site-foot {
  text-align: center;
  font-size: 0.75rem;
  color: #9ca3af;
  padding: 1.5rem 1rem 2.5rem;
}</style>
</head>
